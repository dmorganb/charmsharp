name: Charm# C++20 tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and CLI tests (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
          - os: ubuntu-24.04
            compiler: clang++
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests
        run: make test CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror"

  sanitizers:
    name: Address and undefined-behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v6
      - name: Build and run instrumented unit and CLI tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:log_path=${{ runner.temp }}/charmsharp-asan
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:log_path=${{ runner.temp }}/charmsharp-ubsan
        run: >-
          make test CXXFLAGS="-std=c++20 -O1 -g -Wall -Wextra -Wpedantic
          -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Reject sanitizer reports even from expected-failure CLI tests
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/charmsharp-asan.* "$RUNNER_TEMP"/charmsharp-ubsan.*)
          if (( ${#reports[@]} )); then
            cat "${reports[@]}"
            exit 1
          fi

  byte-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out merged PR1 compiler
        run: git worktree add "$RUNNER_TEMP/charmsharp-pr1" ba914cf1cb504344ac695dbcbac0791c631999d3
      - name: Compare PR1 and PR2 generated output byte-for-byte
        run: bash tests/compare_pr1_pr2_outputs.sh "$RUNNER_TEMP/charmsharp-pr1"

  pr3-byte-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out merged PR2 compiler
        run: git worktree add "$RUNNER_TEMP/charmsharp-pr2" 9d7541ff701a8272d8225bda16f31e855b51eebd
      - name: Compare PR2 and PR3 generated output byte-for-byte
        run: bash tests/compare_pr1_pr2_outputs.sh "$RUNNER_TEMP/charmsharp-pr2"

  charmpp-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build Charm# transpiler
        run: make
      - name: Restore compiled Charm++ v8.0.0
        id: charm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/charm
          key: charmpp-v8.0.0-multicore-linux-x86_64-ubuntu-24.04-production-v1
      - name: Check out Charm++ v8.0.0
        if: steps.charm-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v8.0.0 https://github.com/charmplusplus/charm.git "$RUNNER_TEMP/charm"
      - name: Build Charm++ multicore toolchain
        if: steps.charm-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP/charm"
          ./build charm++ multicore-linux-x86_64 --with-production -j2
      - name: Compile generated .ci and C++ with charmc
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          command -v charmc
          make charm-check

      - name: Build and execute Charm# Hello World
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-run

      - name: Validate independent translation units sharing one Charm++ module
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          bash tests/multifile/build.sh

      - name: Translate and link multiple Charm# sources with one shared interface
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          bash tests/multifile/charmsharp_build.sh

      - name: Exercise PUPable transfer across Charm# source files
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          bash tests/multifile/pup_build.sh

      - name: Exercise explicitly registered template chare across Charm# files
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          bash tests/multifile/template_build.sh

      - name: Build and execute implicit chare Main convention
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-implicit-main

      - name: Compile and execute tracing and appwork entry attributes
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-instrumentation-attributes

      - name: Exercise runtime-owned nokeep messages and exclusive nodegroup entry
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-ownership-exclusive

      - name: Exercise inline and local direct-call entry methods
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-direct-call

      - name: Validate templated chare declaration against Charm++ v8.0.0
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-template-declaration

      - name: Build and run explicitly registered template chare
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-template-registration

      - name: Build and run automatically registered template chare
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-template-auto-registration

      - name: Run two concrete chare template specializations
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-template-multi-specialization

      - name: Build and link a template proxy used across C++ translation units
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-template-cross-tu

      - name: Validate multiple template header definitions and ordering
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-template-header-order

      - name: Build and execute group/nodegroup/array example
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-objects

      - name: Build and run threaded entry example
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-threaded

      - name: Build and run fixed-size message example
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-message

      - name: Compare variable-size message transfer against handwritten Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-variable-message

      - name: Build and run readonly global example
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-readonly

      - name: Compare readonly message pointer initialization with handwritten Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-readonly-message

      - name: Compare initnode and initproc registration with handwritten Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-init-hooks

      - name: Compare PUPable polymorphic serialization with handwritten Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-pupable

      - name: Build and run inherited chare example
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-inheritance

      - name: Build and run inherited message example
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-message-inheritance

      - name: Build and run parallel inherited proxy example
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-parallel-inheritance

      - name: Compare Primes Charm# port against original Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-benchmark-primes

      - name: Compare Reduction Charm# port against original Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-benchmark-reduction

      - name: Compile and run entry constructor initializer fixture
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-ctor-initializers

      - name: Compare Jacobi2D Charm# port against original Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-benchmark-jacobi2d

      - name: Check literal and named bound array marshalling
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-marshalled-arrays

      - name: Compare SDAG when with handwritten Charm++ (both arrival orders)
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-sdag-when

      - name: Compare implicit SDAG serial runs and sequential receives with Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-sdag-sequence

      - name: Compare SDAG if, for, and reference matching with handwritten Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-sdag-control

      - name: Compare every Prefix Sum value across sizes and PEs
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-benchmark-prefix-sum

      - name: Compare SDAG while, forall, overlap and case with handwritten Charm++
        run: |
          export PATH="$RUNNER_TEMP/charm/multicore-linux-x86_64/bin:$PATH"
          make charm-sdag-extended

  output-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR2 compiler
        uses: actions/checkout@v6
        with:
          path: current
      - name: Check out merged PR1 compiler (frozen baseline)
        uses: actions/checkout@v6
        with:
          ref: ba914cf1cb504344ac695dbcbac0791c631999d3
          path: baseline
      - name: Build both compiler versions
        run: |
          make -C baseline
          make -C current
      - name: Compare generated .ci and .cpp byte for byte
        run: bash current/tests/output_equivalence.sh "$GITHUB_WORKSPACE/current" "$GITHUB_WORKSPACE/baseline"

